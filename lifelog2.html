<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeLog 2</title>
</head>
<body>
<div id="nav"></div>
<hr>
<div id="banner"></div>
<div id="status"></div>
<div id="dialog"></div>
<div id="app"></div>
<script>
"use strict";
const KEY = "lifelog2_v1";   // separate from LifeLog 1, so the two files never overwrite each other
const DEFAULTS = {
  emotions: ["happy","calm","content","excited","grateful","focused","anxious","sad","irritable","bored","lonely","overwhelmed","restless","numb"],
  body: ["relaxed","tense","sleepy","sore","headache","hungry","nauseous","sick","jittery"]
};
const METRICS = ["mood","energy","stress"];
const MOOD_WHY = ["work/school","relationships","family","health/body","sleep","money","weather","a recent event","an upcoming event","no clear reason"];
const STRESS_WHY = ["work/school","deadlines/time pressure","relationships","money","health","uncertainty","too many demands","no clear reason"];
const ENERGY_WHY = ["poor sleep","hungry/not eating","long or busy day","illness","boredom","low mood","no clear reason"];
const REL_WHO = ["partner","family","friends","coworkers","other"];
const LOCATIONS = ["home","work/school","commuting","outdoors","shop/restaurant","someone else's place","other"];
const WITH_WHO = ["alone","partner","family","friends","coworkers","strangers"];
const TRIGGERS = ["something someone said or did","a task or deadline","something I read or watched","physical discomfort","worry about the future","dwelling on the past","nothing I can identify"];
const NEG_EMO = ["anxious","sad","irritable","lonely","overwhelmed","restless","numb"];
const FOOD_BODY = ["hungry","nauseous","jittery","headache"];
const PAIN_BODY = ["headache","sore","back/neck pain","joint pain","stomach pain","pain"];   // the last four only appear via profile (chronic pain locations)

/* =====================================================================
   THE ENTRY FORM is one page. The overview (mood, energy, stress 1-10, emotions, body)
   is only about THIS INSTANT, with no look-back. Follow-ups are the RULES table below:
   every rule whose test() is true shows its questions INLINE, directly under the
   overview answer it belongs to (`anchor`). Rules are re-checked after each answer, so a
   follow-up answer can unlock a deeper one (see `parent`). Same idea as the profile.
   The entry is stamped the first time you answer anything, and that time can't be changed.

   HOW TO ADD A FOLLOW-UP: add one object to RULES.
     id      unique name
     anchor  where it appears: "mood" | "energy" | "stress" | "emotions" | "body" | "context" (end of form)
     group   heading shown above the questions
     period  what time span the question covers (shown to you, and on the Logic tab)
     reads   which answers the test looks at (used for the "which answers feed which rules" table)
     parent  (optional) id of the rule this one only makes sense under
     cond    the IF, in plain words (shown to you, and on the Logic tab)
     test    function returning true when the rule applies
     qs      function returning questions: {field, label, type:"radio"|"check"|"number", q, opts, req}
   The Logic tab, the Insights tables and the CSV columns are all generated from this table.
   ===================================================================== */
const ANCHORS=["mood","energy","stress","emotions","body","context"];
const has=(arr,x)=>Array.isArray(arr)&&arr.includes(x);
const hasAny=(arr,xs)=>xs.some(x=>has(arr,x));
const fu=f=>(draft.fu&&draft.fu[f]);

const RULES = [
  {id:"mood_extreme",anchor:"mood",group:"Mood",period:"the moment",reads:["mood"],
   cond:"mood is 4 or below, or 8 or above",
   test:()=>touched.mood&&(draft.mood<=4||draft.mood>=8),
   qs:()=>[{field:"moodWhy",label:"What's behind your mood",type:"check",q:"What's mostly behind your mood right now?",opts:MOOD_WHY,req:true}]},
  {id:"stress_high",anchor:"stress",group:"Stress",period:"the moment",reads:["stress"],
   cond:"stress is 7 or above",
   test:()=>touched.stress&&draft.stress>=7,
   qs:()=>[{field:"stressWhy",label:"Source of stress",type:"check",q:"What's the main source of your stress right now?",opts:STRESS_WHY,req:true},
           {field:"stressControl",label:"Stress manageability",type:"radio",q:"Does the stress feel manageable?",opts:["manageable","borderline","overwhelming"],req:true}]},
  {id:"stress_rel",anchor:"stress",group:"Stress",parent:"stress_high",period:"the moment",reads:["stress","stressWhy"],
   cond:"a stress source you picked is 'relationships'",
   test:()=>touched.stress&&draft.stress>=7&&has(fu("stressWhy"),"relationships"),
   qs:()=>[{field:"relationWho",label:"Which relationship",type:"check",q:"Which relationship(s)?",opts:REL_WHO}]},
  {id:"energy_low",anchor:"energy",group:"Energy",period:"the moment",reads:["energy"],
   cond:"energy is 3 or below",
   test:()=>touched.energy&&draft.energy<=3,
   qs:()=>[{field:"energyWhy",label:"What's draining energy",type:"check",q:"What's likely draining your energy right now?",opts:ENERGY_WHY,req:true}]},
  {id:"neg_emo",anchor:"emotions",group:"Emotions",period:"the moment",reads:["emotions"],
   cond:`you picked a negative emotion (${NEG_EMO.join(", ")})`,
   test:()=>hasAny(draft.emotions,NEG_EMO),
   qs:()=>[{field:"emotionTrigger",label:"What set off the emotion",type:"check",q:"What set off that feeling?",opts:TRIGGERS}]},
  {id:"body_pain",anchor:"body",group:"Body",period:"the moment",reads:["body"],
   cond:`body includes ${PAIN_BODY.join(" or ")}`,
   test:()=>hasAny(draft.body,PAIN_BODY),
   qs:()=>[{field:"discomfort",label:"Discomfort intensity",type:"radio",q:"How intense is the discomfort right now?",opts:["mild","moderate","severe"]}]},
  {id:"food",anchor:"body",group:"Food",period:"the 3 hours before this entry",reads:["energy","body"],
   cond:`energy is 4 or below, or body includes ${FOOD_BODY.join(", ")}`,
   test:()=>(touched.energy&&draft.energy<=4)||hasAny(draft.body,FOOD_BODY),
   qs:()=>[{field:"ate",label:"Ate in the previous 3 hours",type:"radio",q:"Had you eaten in the 3 hours before this entry?",opts:["yes","no"]}]},
  // Fixed-schedule rule: always true, so it is asked on every entry and Insights can compare fairly.
  {id:"context",anchor:"context",group:"Context",period:"the moment",reads:[],
   cond:"it is a fixed question asked on every entry",
   test:()=>true,
   qs:()=>[{field:"location",label:"Location",type:"radio",q:"Where are you right now?",opts:LOCATIONS,req:true},
           {field:"withWho",label:"Who you're with",type:"check",q:"Who are you with right now? (pick 'alone' if nobody)",opts:WITH_WHO,req:true}]}
];

// every follow-up question, once per field (drives Insights tables and CSV columns)
const ALL_QS=(()=>{const m=new Map();RULES.forEach(r=>r.qs().forEach(q=>{if(!m.has(q.field))m.set(q.field,{...q,group:r.group,ruleId:r.id});}));return [...m.values()];})();
/* =====================================================================
   STEP 0 (profile) is asked once, before the first entry can be created.
   It is context about you, not a moment in time. Edit it later from the Data tab.
   It BRANCHES: a question with `when` only appears after the answers it depends on,
   and deeper questions can hang off those (see PROFILE_QS below).
   ===================================================================== */
/* A question's `when(a)` receives only the answers to questions that are currently visible, so a
   hidden parent can never keep its children alive. Order matters: put children right after their parent.
   d = indent depth, why = shown to you ("Asked because ..."), period = time span the question covers. */
const pin=(a,f,...vs)=>vs.some(v=>Array.isArray(a[f])?a[f].includes(v):a[f]===v);
const pnum=(a,f)=>(a[f]==null||a[f]==="")?NaN:Number(a[f]);
const PQ=(type,field,group,q,x)=>Object.assign({field,group,type,q,period:"currently",d:0},x);
const R=(f,g,q,opts,x)=>PQ("radio",f,g,q,Object.assign({opts},x));
const C=(f,g,q,opts,x)=>PQ("check",f,g,q,Object.assign({opts},x));
const N=(f,g,q,x)=>PQ("number",f,g,q,Object.assign({min:1,max:10},x));
const T=(f,g,q,x)=>PQ("text",f,g,q,x);
const G_GOAL="What you want from this",G_DAY="Your weekdays",G_WORK="Work",G_SCH="School",G_CARE="Caregiving and home",G_FREE="Your days",
  G_HOME="Home and people",G_MONEY="Money",G_BASE="Your usual baseline (1-10)",G_SLEEP="Sleep",G_CAF="Caffeine",G_ALC="Alcohol",
  G_EX="Exercise",G_HEALTH="Health (optional, stays on this device)",G_LOG="Logging";
const atWork=a=>pin(a,"daily","work","work and school");
const atSchool=a=>pin(a,"daily","school","work and school");
const care3=["managed with treatment or support","not treated or supported","not sure"];
const PROFILE_QS=[
 // ---- goals
 C("goals",G_GOAL,"What do you most want to learn from logging?",["what affects my mood","what causes my stress","what affects my energy","how my activities make me feel","how sleep affects me","how my body and mood connect","tracking a health or mental-health condition","just curious"],{req:true,period:"going forward"}),
 R("goalMoodSwing",G_GOAL,"Does your mood change a lot within a single day?",["rarely","sometimes","often"],{d:1,when:a=>pin(a,"goals","what affects my mood"),why:"you want to learn what affects your mood",period:"a typical day lately"}),
 C("goalStressGuess",G_GOAL,"What do you already suspect is behind your stress?",STRESS_WHY,{d:1,when:a=>pin(a,"goals","what causes my stress"),why:"you want to learn what causes your stress",period:"lately"}),
 R("goalEnergyLow",G_GOAL,"When is your energy usually lowest?",["morning","afternoon","evening","varies"],{d:1,when:a=>pin(a,"goals","what affects my energy"),why:"you want to learn what affects your energy",period:"a typical day lately"}),
 C("goalActs",G_GOAL,"Which kinds of activities are you most curious about?",["work / school","exercise","social time","hobbies","screens / social media","chores","rest / relaxing"],{d:1,when:a=>pin(a,"goals","how my activities make me feel"),why:"you want to learn how activities make you feel",period:"going forward"}),
 R("goalSleepIssue",G_GOAL,"What is the main sleep problem, if any?",["falling asleep","staying asleep","waking too early","not enough time in bed","sleep isn't refreshing","no real problem"],{d:1,when:a=>pin(a,"goals","how sleep affects me"),why:"you want to learn how sleep affects you",period:"lately"}),
 R("goalPro",G_GOAL,"Are you working with a doctor or therapist on this?",["yes","no","not yet, but I'd like to"],{d:1,when:a=>pin(a,"goals","tracking a health or mental-health condition"),why:"you want to track a health or mental-health condition"}),
 R("goalProFreq",G_GOAL,"How often do you see them?",["weekly or more","every few weeks","every few months","rarely"],{d:2,when:a=>pin(a,"goalPro","yes"),why:"you work with a professional"}),
 // ---- weekdays
 R("daily",G_DAY,"What fills most of your weekdays?",["work","school","work and school","caregiving / home","neither right now","varies a lot"],{req:true,period:"a typical week"}),
 // work
 R("workKind",G_WORK,"What kind of work do you do?",["office / desk","tech / engineering","healthcare","education","trades / manual labor","retail / service","creative","self-employed / freelance","other"],{d:1,when:atWork,why:"most of your weekdays are work",period:"your current job"}),
 T("workKindOther",G_WORK,"Describe your work briefly.",{d:2,when:a=>pin(a,"workKind","other"),why:"you picked 'other'"}),
 N("workHours",G_WORK,"Roughly how many hours a week do you work?",{d:1,min:0,max:100,when:atWork,period:"a typical week"}),
 R("workOvertime",G_WORK,"Are the long hours your choice?",["yes","no, it's expected","no, I need the money"],{d:2,when:a=>pnum(a,"workHours")>50,why:"you work over 50 hours a week",period:"a typical week"}),
 R("workSchedule",G_WORK,"What is your schedule like?",["regular daytime","shift work","rotating or night shifts","irregular / on call","flexible"],{d:1,when:atWork}),
 R("workShiftSleep",G_WORK,"Does your schedule disrupt your sleep?",["often","sometimes","no"],{d:2,when:a=>pin(a,"workSchedule","shift work","rotating or night shifts","irregular / on call"),why:"your schedule is shifts, nights or on call",period:"a typical week"}),
 R("workPlace",G_WORK,"Where do you work?",["on-site","remote","hybrid","varies"],{d:1,when:atWork}),
 N("workCommute",G_WORK,"Minutes each way to get there?",{d:2,min:0,max:300,when:a=>pin(a,"workPlace","on-site","hybrid"),why:"you work on-site or hybrid",period:"a typical workday"}),
 R("workTenure",G_WORK,"How long have you had this job?",["under 6 months","6-12 months","1-3 years","3-10 years","over 10 years"],{d:1,when:atWork}),
 N("workPay",G_WORK,"Roughly how much do you take home per month after tax? (number, your currency; skip if you prefer)",{d:1,min:0,max:1e9,when:atWork,period:"a typical month"}),
 R("workPayFair",G_WORK,"Do you feel fairly paid for the work?",["underpaid","about fair","overpaid"],{d:1,when:atWork}),
 N("workLike",G_WORK,"How much do you like the job? (1 hate, 10 love)",{d:1,when:atWork,period:"lately"}),
 C("workDislike",G_WORK,"What bothers you most about it?",["boss","colleagues","workload","pay","boredom","no room to grow","values mismatch","schedule","commute","other"],{d:2,when:a=>pnum(a,"workLike")<=4,why:"you rated the job 4 or below",period:"lately"}),
 C("workMixed",G_WORK,"What would make it better?",["pay","workload","colleagues","flexibility","growth","more meaning"],{d:2,when:a=>pnum(a,"workLike")>=5&&pnum(a,"workLike")<=7,why:"you rated the job 5-7",period:"lately"}),
 C("workLikeWhy",G_WORK,"What do you like most about it?",["meaningful work","colleagues","pay","flexibility","growth","challenge","other"],{d:2,when:a=>pnum(a,"workLike")>=8,why:"you rated the job 8 or above",period:"lately"}),
 R("workQual",G_WORK,"How qualified do you feel for it?",["under-qualified (stretching)","about right","over-qualified"],{d:1,when:atWork}),
 R("workQualStress",G_WORK,"Does that cause you stress?",["often","sometimes","no"],{d:2,when:a=>pin(a,"workQual","under-qualified (stretching)"),why:"you feel under-qualified",period:"lately"}),
 R("workQualBored",G_WORK,"Do you feel bored or under-challenged?",["often","sometimes","rarely"],{d:2,when:a=>pin(a,"workQual","over-qualified"),why:"you feel over-qualified",period:"lately"}),
 R("workSecure",G_WORK,"How secure does the job feel?",["very secure","somewhat","insecure"],{d:1,when:atWork}),
 R("workStressFreq",G_WORK,"How often is work stressful?",["rarely","sometimes","often","almost always"],{d:1,when:atWork,period:"lately"}),
 C("workStressSrc",G_WORK,"What makes it stressful?",["workload","deadlines","boss","colleagues","customers / clients","uncertainty","long hours","safety"],{d:2,when:a=>pin(a,"workStressFreq","often","almost always"),why:"work is often stressful",period:"lately"}),
 R("workSupport",G_WORK,"Do you feel supported by your boss and colleagues?",["yes","mixed","no"],{d:1,when:atWork,period:"lately"}),
 R("workLeave",G_WORK,"Are you thinking of leaving?",["no","maybe","yes, looking"],{d:1,when:atWork,period:"lately"}),
 // school
 R("schoolLevel",G_SCH,"What level of school?",["high school","college / university","graduate","vocational","other"],{d:1,when:atSchool,why:"school fills your weekdays"}),
 R("schoolLoad",G_SCH,"Full-time or part-time?",["full-time","part-time"],{d:1,when:atSchool}),
 N("schoolHours",G_SCH,"Roughly how many hours a week in class plus studying?",{d:1,min:0,max:100,when:atSchool,period:"a typical week"}),
 N("schoolLike",G_SCH,"How much do you like it? (1 hate, 10 love)",{d:1,when:atSchool,period:"lately"}),
 R("schoolGrades",G_SCH,"How are your grades going?",["above expectations","on track","struggling"],{d:1,when:atSchool,period:"this term"}),
 C("schoolStruggle",G_SCH,"What is making it hard?",["workload","understanding the material","motivation","time","attention / focus","stress","other"],{d:2,when:a=>pin(a,"schoolGrades","struggling"),why:"you are struggling with grades",period:"this term"}),
 R("schoolDeadlines",G_SCH,"How often are you up against deadlines?",["rarely","sometimes","often"],{d:1,when:atSchool,period:"this term"}),
 R("schoolMoney",G_SCH,"Do you worry about paying for school?",["no","a bit","a lot"],{d:1,when:atSchool}),
 // caregiving
 C("careWho",G_CARE,"Who do you care for?",["children","partner","parent","other relative","just running the home"],{d:1,when:a=>pin(a,"daily","caregiving / home"),why:"caregiving or home fills your weekdays"}),
 C("careKids",G_CARE,"How old are the children?",["under 5","5-12","teens","adult"],{d:2,when:a=>pin(a,"careWho","children"),why:"you care for children"}),
 N("careHours",G_CARE,"Roughly how many hours a day?",{d:1,min:0,max:24,when:a=>pin(a,"daily","caregiving / home"),period:"a typical day"}),
 R("careHelp",G_CARE,"Do you have help with it?",["yes","some","no"],{d:1,when:a=>pin(a,"daily","caregiving / home")}),
 R("careBreaks",G_CARE,"Do you get regular breaks for yourself?",["yes","sometimes","rarely"],{d:1,when:a=>pin(a,"daily","caregiving / home"),period:"a typical week"}),
 N("careLike",G_CARE,"How sustainable does it feel? (1 not at all, 10 easily)",{d:1,when:a=>pin(a,"daily","caregiving / home"),period:"lately"}),
 // neither / varies
 R("freeWhy",G_FREE,"What is the situation?",["between jobs","retired","health reasons","taking a break","other"],{d:1,when:a=>pin(a,"daily","neither right now"),why:"you have no work or school right now"}),
 R("freeSeek",G_FREE,"Are you looking for work or study?",["yes, actively","thinking about it","no"],{d:2,when:a=>pin(a,"freeWhy","between jobs","taking a break"),why:"you are between jobs or on a break"}),
 C("freeDays",G_FREE,"How do you mostly spend your days?",["hobbies","socializing","errands / chores","screens","exercise","resting","volunteering"],{d:1,when:a=>pin(a,"daily","neither right now"),period:"a typical week"}),
 R("freeStruct",G_FREE,"Do your days feel structured?",["yes","somewhat","no"],{d:1,when:a=>pin(a,"daily","neither right now"),period:"a typical week"}),
 C("variesWhy",G_FREE,"Why does it vary?",["gig / freelance work","shift work","seasonal","caregiving","health","other"],{d:1,when:a=>pin(a,"daily","varies a lot"),why:"your weekdays vary a lot"}),
 R("variesPlan",G_FREE,"Can you plan your week ahead?",["yes","partly","no"],{d:1,when:a=>pin(a,"daily","varies a lot")}),
 // ---- home and people
 R("living",G_HOME,"Who do you live with?",["alone","partner","family","roommates","other"],{}),
 T("livingOther",G_HOME,"Describe your living situation briefly.",{d:1,when:a=>pin(a,"living","other"),why:"you picked 'other'"}),
 R("aloneLike",G_HOME,"Do you like living alone?",["yes","mixed","no"],{d:1,when:a=>pin(a,"living","alone"),why:"you live alone"}),
 R("lonely",G_HOME,"How often do you feel lonely?",["rarely","sometimes","often","almost always"],{d:1,when:a=>pin(a,"living","alone"),period:"lately"}),
 N("relSat",G_HOME,"How satisfied are you with the relationship? (1 not at all, 10 very)",{d:1,when:a=>pin(a,"living","partner"),why:"you live with a partner",period:"lately"}),
 C("relIssue",G_HOME,"What strains it most?",["communication","intimacy","money","time apart","trust","other"],{d:2,when:a=>pnum(a,"relSat")<=4,why:"you rated it 4 or below",period:"lately"}),
 R("relTogether",G_HOME,"How much time do you spend together on a typical day?",["little","a few hours","most of the day"],{d:1,when:a=>pin(a,"living","partner"),period:"a typical day"}),
 C("famWho",G_HOME,"Who is in your household?",["parents","siblings","children","extended family"],{d:1,when:a=>pin(a,"living","family"),why:"you live with family"}),
 R("famGet",G_HOME,"How well do you get along at home?",["well","mixed","poorly"],{d:1,when:a=>pin(a,"living","family"),period:"lately"}),
 C("famStrain",G_HOME,"What causes tension?",["conflict","expectations","privacy","money","caregiving","other"],{d:2,when:a=>pin(a,"famGet","mixed","poorly"),why:"home life is mixed or poor",period:"lately"}),
 R("roomGet",G_HOME,"How well do you get along with roommates?",["well","mixed","poorly"],{d:1,when:a=>pin(a,"living","roommates"),why:"you live with roommates",period:"lately"}),
 R("roomQuiet",G_HOME,"Do you get enough privacy and quiet?",["yes","sometimes","no"],{d:1,when:a=>pin(a,"living","roommates"),period:"lately"}),
 R("housing",G_HOME,"What is your housing like?",["rent","own","with family, no rent","temporary / unstable"],{}),
 R("housingWorry",G_HOME,"How worried are you about housing?",["a bit","a lot"],{d:1,when:a=>pin(a,"housing","temporary / unstable"),why:"your housing is temporary or unstable",period:"lately"}),
 R("socialFreq",G_HOME,"How often do you see friends in person?",["most days","weekly","monthly","rarely"],{period:"lately"}),
 R("socialWant",G_HOME,"Would you like to see them more?",["yes","no"],{d:1,when:a=>pin(a,"socialFreq","monthly","rarely"),why:"you see friends monthly or less",period:"lately"}),
 C("socialWhy",G_HOME,"What gets in the way?",["time","distance","energy","anxiety","few friends nearby","money"],{d:2,when:a=>pin(a,"socialWant","yes"),why:"you would like to see friends more",period:"lately"}),
 // ---- money
 R("money",G_MONEY,"How comfortable is your financial situation?",["struggling","tight","okay","comfortable"],{period:"lately"}),
 R("moneyWorry",G_MONEY,"How often does money worry you?",["sometimes","often","constantly"],{d:1,when:a=>pin(a,"money","struggling","tight"),why:"money is tight or you're struggling",period:"lately"}),
 R("moneyDebt",G_MONEY,"Does debt weigh on you?",["no","some","a lot"],{d:1,when:a=>pin(a,"money","struggling","tight"),period:"lately"}),
 // ---- baseline
 N("baseMood",G_BASE,"On a typical day, how is your mood? (1 awful, 10 great)",{period:"a typical day lately"}),
 R("moodLowLong",G_BASE,"How long has your mood been this low?",["under 2 weeks","2 weeks to 3 months","over 3 months","it's always been this way"],{d:1,when:a=>pnum(a,"baseMood")<=4,why:"your usual mood is 4 or below",period:"until now"}),
 C("moodLowCause",G_BASE,"What do you think is behind it?",MOOD_WHY,{d:1,when:a=>pnum(a,"baseMood")<=4,period:"lately"}),
 R("moodLowHelp",G_BASE,"Are you getting support for it?",["yes","no","not sure"],{d:1,when:a=>pnum(a,"baseMood")<=4,period:"currently"}),
 C("moodHighWhy",G_BASE,"What keeps it up?",["relationships","work / school","health","routine","hobbies","other"],{d:1,when:a=>pnum(a,"baseMood")>=8,why:"your usual mood is 8 or above",period:"lately"}),
 N("baseEnergy",G_BASE,"On a typical day, how is your energy? (1 drained, 10 energized)",{period:"a typical day lately"}),
 C("energyLowCause",G_BASE,"What do you think drains it?",ENERGY_WHY,{d:1,when:a=>pnum(a,"baseEnergy")<=4,why:"your usual energy is 4 or below",period:"lately"}),
 R("energyLowLong",G_BASE,"How long has energy been this low?",["under 2 weeks","2 weeks to 3 months","over 3 months","it's always been this way"],{d:1,when:a=>pnum(a,"baseEnergy")<=4,period:"until now"}),
 N("baseStress",G_BASE,"On a typical day, how is your stress? (1 calm, 10 extreme)",{period:"a typical day lately"}),
 C("stressHighCause",G_BASE,"What is behind your usual stress?",STRESS_WHY,{d:1,when:a=>pnum(a,"baseStress")>=7,why:"your usual stress is 7 or above",period:"lately"}),
 C("stressCope",G_BASE,"How do you cope with it?",["exercise","talking to someone","rest","screens","alcohol or other substances","avoiding it","nothing"],{d:1,when:a=>pnum(a,"baseStress")>=7,period:"lately"}),
 R("stressCopeSubst",G_BASE,"How often do you use alcohol or substances to cope?",["rarely","sometimes","often"],{d:2,when:a=>pin(a,"stressCope","alcohol or other substances"),why:"you cope with alcohol or substances",period:"lately"}),
 // ---- sleep
 R("sleepTypical",G_SLEEP,"How much do you usually sleep per night?",["under 5 hours","5-6 hours","6-7 hours","7-8 hours","8-9 hours","over 9 hours","very irregular"],{period:"a typical night lately"}),
 C("sleepShortWhy",G_SLEEP,"What cuts your sleep short?",["can't fall asleep","wake during the night","wake too early","work / school schedule","kids or caregiving","noise or environment","I stay up by choice","health"],{d:1,when:a=>pin(a,"sleepTypical","under 5 hours","5-6 hours"),why:"you usually sleep under 6 hours",period:"a typical night lately"}),
 C("sleepLongWhy",G_SLEEP,"Why do you sleep that much?",["I need it","low mood or energy","no fixed schedule","health","other"],{d:1,when:a=>pin(a,"sleepTypical","over 9 hours"),why:"you usually sleep over 9 hours",period:"a typical night lately"}),
 C("sleepIrregWhy",G_SLEEP,"Why is your sleep irregular?",["shift work","lifestyle","insomnia","caregiving","other"],{d:1,when:a=>pin(a,"sleepTypical","very irregular"),why:"your sleep is very irregular",period:"lately"}),
 R("sleepRested",G_SLEEP,"Do you wake up rested?",["usually","sometimes","rarely"],{period:"a typical morning lately"}),

const OVERVIEW_ADAPT=[
  {id:"anxiety",why:"you listed anxiety",test:a=>pin(a,"conditions","anxiety"),fx:a=>({emotions:["anxious","overwhelmed","restless"],body:["tense","jittery"]})},

function adaptation(){
  const out={emotions:[],body:[],addEmotions:[],addBody:[],reasons:[]};
  if(!profileDone())return out;
  const a=db.profile.answers,push=(arr,xs)=>(xs||[]).forEach(x=>{if(!arr.includes(x))arr.push(x);});
  OVERVIEW_ADAPT.forEach(r=>{
    if(!r.test(a))return;
    const f=r.fx(a);
    push(out.emotions,f.emotions);push(out.body,f.body);push(out.addEmotions,f.addEmotions);push(out.addBody,f.addBody);
    out.reasons.push(r.why);
  });
  return out;
}

const LEGACY_FU=["moodWhy","stressWhy","stressControl","relationWho","energyWhy","emotionTrigger","ate"];   // LifeLog 1 backups import into follow-ups
function normalize(d){
  if(!d||!Array.isArray(d.entries))d={entries:[]};
  for(const k of ["emotions","body"])if(!Array.isArray(d[k]))d[k]=DEFAULTS[k].slice();
  d.entries.forEach(e=>{
    ["emotions","body"].forEach(k=>{if(!Array.isArray(e[k]))e[k]=[];});
    if(!e.fu||typeof e.fu!=="object"){
      e.fu={};
      LEGACY_FU.forEach(k=>{const v=e[k];if(v!=null&&v!==""&&!(Array.isArray(v)&&!v.length))e.fu[k]=v;});
    }
  });
  d.entries.sort((x,y)=>String(x.ts)<String(y.ts)?-1:String(x.ts)>String(y.ts)?1:0);
  const p=d.profile;
  d.profile=(p&&typeof p==="object"&&p.done&&p.answers&&typeof p.answers==="object")?{done:true,ts:p.ts||null,answers:p.answers}:null;
  return d;
}

const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
function pearson(xs,ys){
  const n=xs.length;if(n<3)return null;
  const mx=mean(xs),my=mean(ys);let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
  return sxx&&syy?sxy/Math.sqrt(sxx*syy):null;
}

    if(empty){if(q.req)miss.push(q.q);return;}
    if(q.type==="number"){
      const n=Number(v);
      if(!(n>=q.min&&n<=q.max)){miss.push(`${q.q} (enter ${q.min}-${q.max}, or clear it)`);return;}
      answers[q.field]=n;
    }else if(q.type==="text")answers[q.field]=String(v).trim();

function stampDraft(){
  if(draft.ts)return;
  draft.ts=new Date().toISOString();
  const e=document.getElementById("stamp");if(e)e.textContent=stampText();
}

function viewHistory(){
  const es=db.entries.slice().reverse();
  if(!es.length)return `<h1>History</h1><p>No entries yet.</p>`;
  return `<h1>History</h1><p>Showing the latest ${Math.min(es.length,100)} of ${es.length}.</p><ul>`+es.slice(0,100).map(e=>{
    const d=new Date(e.ts);
    const feel=[...e.emotions,...e.body].join(", ");
    const extra=Object.entries(e.fu||{}).map(([k,v])=>`${qLabel(k)}: ${asArr(v).join(", ")}`).join("; ");
    return `<li>${esc(fmtDT(d))}: mood ${e.mood}, energy ${e.energy}, stress ${e.stress}
    ${feel?"<br>"+esc(feel):""}${extra?"<br>"+esc(extra):""}
    <br><button data-del="${e.id}">Delete</button></li><br>`;}).join("")+`</ul>`;
}

/* ---------- Logic tab (generated from RULES) ---------- */
function viewLogic(){
  const T=`<table border="1" cellpadding="4" cellspacing="0">`;
  const docQs=r=>r.qs().map(q=>esc(q.q)+(q.req?" *":"")).join("; ");
  const on=r=>!!r.test();
  const tree=()=>{
    const kids=pid=>RULES.filter(r=>r.parent===pid);
    const li=r=>{const k=kids(r.id);
      return `<li><b>IF</b> ${esc(r.cond)}${on(r)?" <i>(active now)</i>":""}<br><b>ASK</b> ${docQs(r)}${k.length?`<ul>${k.map(li).join("")}</ul>`:""}</li>`;};
    return `<ul>${RULES.filter(r=>!r.parent).map(li).join("")}</ul>`;
  };
  const used=[...new Set(RULES.flatMap(r=>r.reads))];
  const keys=[...Object.keys(READ_LABEL),...used.filter(k=>!(k in READ_LABEL))];
  const feeds=keys.map(k=>{
    const rs=RULES.filter(r=>r.reads.includes(k));
    const name=k in READ_LABEL?READ_LABEL[k]:"Follow-up answer: "+qLabel(k);
    return `<tr><td>${esc(name)}</td><td>${rs.length?rs.map(r=>`${esc(r.cond)} &rarr; ${esc(r.group)}${on(r)?" <i>(active now)</i>":""}`).join("<br>"):"(no rule reads this yet)"}</td></tr>`;
  }).join("");
  return `<h1>How questions are chosen</h1>
  <p>After the one-time profile, every entry is one page. The overview of how you are right now is always asked (its questions are fixed, but the order and extras of its emotion and body choices adapt to your profile). Follow-ups are chosen by the rules below and appear inline, right under the overview answer that triggers them, the same way the profile branches. Deeper follow-ups can depend on your earlier follow-up answers. This page is generated from the same rule table the form uses, so it always matches what the form does.</p>

  <h2>Flowchart</h2>
<pre style="white-space:pre-wrap">+-----------------------------+
| PROFILE (once)              |
| required ones must be       |
| answered; editable on the   |
| Data tab                    |
+--------------+--------------+
               | [Save and start logging]
               v
+-----------------------------+
| ENTRY (one page)            |
| overview, this instant only:|
| mood, energy, stress,       |
| emotions, body              |
|   |                         |
|   +--> rules run after every|
|        answer; matching     |
|        follow-ups appear    |
|        right under the      |
|        answer, and an answer|
|        can open deeper ones |
| fixed Context questions at  |
| the end                     |
+--------------+--------------+
               | [Save entry]
               | stamped at your first answer
               v
+-----------------------------+
| SAVE                        |
| required (*) must be filled |
| only visible questions are  |
| stored                      |
+-----------------------------+</pre>

  <h2>Step 0: getting to know you</h2>
  <p>Before your first entry you answer a one-time profile (goals, daily life, usual mood/energy/stress baseline, sleep, caffeine, alcohol and exercise habits, health context, when you plan to log). It is stored in this browser and included in JSON backups, but it is not part of any entry and does not change which follow-ups are asked. Baselines are saved for your own reference and are not yet used in Insights. Profile questions live in the PROFILE_QS table.</p>
  <p>The profile <b>branches</b>: for example, saying your weekdays are mostly work opens questions about the kind of work, hours, pay, how much you like it and how qualified you feel, and answers to those open still deeper ones (a low job rating asks what bothers you). Answers you give to a question that later disappears (because you changed a parent answer) are dropped when you save.</p>
  <details><summary>Profile branches as an outline (${PROFILE_QS.length} questions)</summary>
  ${PROFILE_QS.map(q=>`<div style="margin-left:${q.d*1.5}em">${q.why?`<small><b>IF</b> ${esc(q.why)}</small><br>`:""}${esc(q.q)}${q.req?" *":""} <small>[${esc(q.period)}]</small></div>`).join("")}
  </details>
  <h2>What time does an entry cover?</h2>
  <ul>
  <li><b>The overview</b> covers one instant: the moment you first answer on the entry page. It can't be changed or back-dated, and it asks nothing about the past.</li>
  <li><b>Follow-ups</b> each name their own period, shown here and above the question when it appears.</li>
  </ul>
  ${T}<tr><th>Follow-up group</th><th>Period it covers</th></tr>${RULES.map(r=>`<tr><td>${esc(r.group)}${r.parent?" (deeper)":""}</td><td>${esc(r.period)}</td></tr>`).join("")}</table>

  <h2>Overview: always asked</h2>
  <ul><li>Mood, energy, stress (1-10; you must set each). After you set one, it shows how far it is from your usual value from the profile. The usual value is hidden until you rate, so it doesn't anchor you.</li><li>Emotions right now (any)</li><li>Body sensations right now (any)</li></ul>
  <h3>How the profile tailors the overview</h3>
  <p>The same questions are always asked. The profile only moves some choices into a "Suggested for you" row and can add a few body options. It never hides a choice, never changes the follow-up rules, and the stored data looks the same. Added options (chronic pain locations) count as body pain for the discomfort follow-up.</p>
  ${T}<tr><th>Profile says</th><th>Suggested emotions</th><th>Suggested body</th><th>Adds</th></tr>${OVERVIEW_ADAPT.map(r=>{let f={};try{f=profileDone()?r.fx(db.profile.answers):r.fx({});}catch(e){}
    const ac=profileDone()&&r.test(db.profile.answers);
    return `<tr><td>${esc(r.why)}${ac?" <i>(active for you)</i>":""}</td><td>${esc((f.emotions||[]).join(", "))}</td><td>${esc((f.body||[]).join(", "))}</td><td>${esc([...(f.addEmotions||[]),...(f.addBody||[])].join(", "))}</td></tr>`;}).join("")}</table>

  <h2>Which answers feed which rules</h2>
  ${T}<tr><th>Answer</th><th>Rules that read it</th></tr>${feeds}</table>

  <h2>Follow-up rules as an outline</h2>
  <p>Checked top to bottom after every answer. Indented rules fire only after their parent applies and you give the answer they depend on. * = required to save. "Active now" marks rules that currently apply to the entry you are drafting.</p>
  ${tree()}

  <h2>Why it works this way</h2>
  <ul>
  <li><b>Where follow-ups appear.</b> Each rule has an <code>anchor</code>; its questions show directly under that overview answer (mood, energy, stress, emotions, body), and the fixed Context questions sit at the end.</li>
  <li><b>Required vs. optional.</b> Reasons behind extreme ratings, and the fixed Context questions (location, who you're with), are required; everything else can be skipped.</li>
  <li><b>Thresholds.</b> Extreme means mood 4 or below or 8 or above, stress 7 or above, and energy 3 or below. Ratings are subjective, so these are rough cut-offs.</li>
  <li><b>Fixed-schedule questions.</b> Context is asked on every entry regardless of how you feel, so comparisons (e.g. mood at work vs. at home) are not biased by only asking when you feel bad. Sleep, caffeine and alcohol should be added the same way (a rule whose test always returns true, or true on the first entry of each day).</li>
  <li><b>Missing data.</b> A follow-up exists only for entries where its rule fired. Insights tables therefore compare only entries where the question was asked.</li>
  <li><b>Changing your mind.</b> Just change an overview answer: follow-ups that no longer apply disappear, and their answers are dropped when you save (they come back if you re-select).</li>
  <li><b>Custom emotions or body items</b> you add do not trigger any rule, because the app can't know how you would rate them.</li>
  <li><b>Adding follow-ups.</b> Each new rule added to the table appears on this page, in Insights, and in the CSV export automatically.</li>
  </ul>`;
}

function viewInsights(){
  const es=db.entries;
  if(es.length<5)return `<h1>Insights</h1><p>Log at least 5 entries to see anything. Patterns get meaningful with 30 or more.</p>`;
  const T=`<table border="1" cellpadding="4" cellspacing="0">`;
  let h=`<h1>Insights</h1><p>${es.length} entries. Mood, energy and stress are 1-10 and describe the moment of each entry. Tables show averages for entries where an item applied. Small n means weak evidence, and correlation is not causation.</p>`;
  const avgOf=(s,m)=>{const v=s.map(e=>e[m]).filter(x=>x!=null);return v.length?mean(v):null;};
  const avgTable=(label,keysFn,order)=>{
    const g=Object.create(null);
    es.forEach(e=>(keysFn(e)||[]).forEach(k=>{(g[k]=g[k]||[]).push(e);}));
    const keys=order||Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
    if(!keys.some(k=>g[k]))return "";
    return `<h2>${esc(label)}</h2>${T}<tr><th></th><th>n</th><th>Mood</th><th>Energy</th><th>Stress</th></tr>`+
      keys.map(k=>{const s=g[k]||[];return `<tr><td>${esc(k)}</td><td>${s.length}</td>${METRICS.map(m=>`<td>${s.length?f1(avgOf(s,m)):"-"}</td>`).join("")}</tr>`;}).join("")+`</table>`;
  };

  // trend: 7-entry rolling average of each metric
  const roll=m=>{const v=es.map(e=>e[m]);return v.map((_,i)=>mean(v.slice(Math.max(0,i-6),i+1)));};
  const pts=a=>a.map((v,i)=>`${(i/Math.max(1,a.length-1))*300},${100-(v-1)/9*100}`).join(" ");
  const line=(m,dash)=>`<polyline fill="none" stroke="currentColor" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:""} points="${pts(roll(m))}"/>`;
  h+=`<h2>Trend (7-entry average)</h2><svg viewBox="0 -4 300 108" width="100%" height="110" preserveAspectRatio="none" style="border:1px solid">${line("mood","")}${line("energy","8 4")}${line("stress","2 4")}</svg>
  <p>Solid = mood, dashed = energy, dotted = stress. Scale 1 (bottom) to 10 (top).</p>`;

  h+=avgTable("Emotions",e=>e.emotions);
  h+=avgTable("Body",e=>e.body);
  ALL_QS.forEach(q=>{if(q.type==="check"||q.type==="radio")h+=avgTable(`${q.group}: ${q.label||q.field}`,e=>asArr((e.fu||{})[q.field]));});

  const bucket=x=>x>=5&&x<12?"morning":x>=12&&x<17?"afternoon":x>=17&&x<22?"evening":"night";
  h+=avgTable("By time of day",e=>[bucket(new Date(e.ts).getHours())],["morning","afternoon","evening","night"]);
  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  h+=avgTable("By day of week",e=>[days[new Date(e.ts).getDay()]],days);

  const numFields=ALL_QS.filter(q=>q.type==="number").map(q=>q.field);
  const vars=[...METRICS,...numFields],val=(e,v)=>METRICS.includes(v)?e[v]:((e.fu||{})[v]!=null?Number((e.fu||{})[v]):null),pairs=[];
  for(let i=0;i<vars.length;i++)for(let j=i+1;j<vars.length;j++){
    const sub=es.filter(e=>val(e,vars[i])!=null&&val(e,vars[j])!=null);
    if(sub.length<5)continue;
    const r=pearson(sub.map(e=>val(e,vars[i])),sub.map(e=>val(e,vars[j])));
    if(r!=null)pairs.push([vars[i],vars[j],r,sub.length]);}
  pairs.sort((a,b)=>Math.abs(b[2])-Math.abs(a[2]));
  if(pairs.length)h+=`<h2>Correlations (r, strongest first)</h2>${T}<tr><th>Pair</th><th>n</th><th>r</th></tr>`+pairs.map(([a,b,r,n])=>`<tr><td>${esc(a)} / ${esc(b)}</td><td>${n}</td><td>${r.toFixed(2)}</td></tr>`).join("")+`</table>`;
  return h;
}

function profileSummary(){
  if(!profileDone())return `<p>Not filled in yet. You must do this before you can create entries.</p>`;
  const a=db.profile.answers;
  const rows=PROFILE_QS.filter(q=>a[q.field]!=null).map(q=>`<li>${esc(q.q)} ${esc(asArr(a[q.field]).join(", "))}</li>`).join("");
  return rows?`<ul>${rows}</ul>`:`<p>Profile saved with no optional answers.</p>`;
}
let outText=null;
const outHTML=()=>outText?`<h2>${esc(outText.name)}</h2><p>If the file did not download, tap Select all, copy, and paste it into a notes app or file.</p><p><textarea readonly rows="6" cols="30" id="outTa">${esc(outText.text)}</textarea><br><button data-sel="outTa">Select all</button></p>`:"";
function viewData(){
  const list=(label,key)=>`<h2>${label}</h2><p>${db[key].map(a=>`<label style="white-space:nowrap">${esc(a)} <button data-rl="${key}" data-rm="${esc(a)}">x</button></label> `).join("")}</p>`;
  return `<h1>Your data</h1>
  <p>Everything lives in this browser on this device. Nothing is uploaded. Back up regularly: clearing browser data erases it. LifeLog 2 keeps its data separately from LifeLog 1; a LifeLog 1 backup can be imported here (its follow-up answers carry over, other fields are kept but not shown).</p>
  <h2>Your profile</h2>
  ${profileSummary()}
  <p><button id="editProfile">${profileDone()?"Edit profile":"Fill in profile"}</button></p>
  <p><button id="expCsv">Export entries (CSV)</button></p>
  <p><button id="expJson">Export backup (JSON)</button> <button id="impJson">Import backup file</button>
  <input type="file" id="file" accept=".json" hidden></p>
  ${outHTML()}
  <p><label>Or paste a backup here to restore it:<br><textarea id="paste" rows="3" cols="30"></textarea></label><br><button id="impPaste">Import pasted backup</button></p>
  ${list("Emotion list","emotions")}${list("Body list","body")}
  <p>Removing an item from a list does not delete it from past entries.</p>
  <h2>Danger zone</h2>
  <p><button id="wipe">Delete all data</button></p>`;
}

/* ---------- saving ---------- */
function saveEntry(){
  const qs=activeQs(),miss=METRICS.filter(k=>!touched[k]).map(k=>`Set ${k} right now`);
  qs.forEach(q=>{if(!q.req)return;const v=getVal(q);if(q.type==="check"?!v.length:v==="")miss.push(q.q);});
  if(miss.length||!draft.ts){status(`<p><b>Please complete:</b></p><ul>${miss.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`);return;}
  const out={};
  qs.forEach(q=>{const v=getVal(q);if(Array.isArray(v)?v.length:v!=="")out[q.field]=Array.isArray(v)?v.slice():(q.type==="number"?Number(v):v);});
  db.entries.push({id:Date.now(),ts:draft.ts,savedAt:new Date().toISOString(),mood:draft.mood,energy:draft.energy,stress:draft.stress,
    emotions:draft.emotions.slice(),body:draft.body.slice(),fu:out});
  db.entries.sort((x,y)=>x.ts<y.ts?-1:x.ts>y.ts?1:0);
  const ok=save();
  resetDraft();render();
  say(ok?"Entry saved.":"Entry kept in memory only: browser storage is unavailable here, so it will be lost when this page closes. Export a backup from the Data tab.");
}

/* ---------- export ---------- */
function download(name,text,type){
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();}catch(e){}
  outText={name,text};   // copy-out area, in case the viewer blocks downloads
  if(tab==="data")render();
  say(`Export ready: ${name}. If no download started, use the text box further down this page.`);
}
const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
function exportEntries(stamp){
  const fields=ALL_QS.map(x=>x.field);
  const rows=[["timestamp","saved_at","mood","energy","stress","emotions","body",...fields].join(",")].concat(
    db.entries.map(e=>[e.ts,e.savedAt??"",e.mood,e.energy,e.stress,q(e.emotions.join(";")),q(e.body.join(";")),
      ...fields.map(f=>{const v=(e.fu||{})[f];return q(Array.isArray(v)?v.join(";"):v??"");})].join(",")));
  download(`lifelog2-entries-${stamp}.csv`,rows.join("\n"),"text/csv");
}

/* ---------- events (delegated) ---------- */
const app=document.getElementById("app");
const setSlider=t=>{stampDraft();const k=t.dataset.s;draft[k]=+t.value;touched[k]=true;const l=document.getElementById("v_"+k);if(l)l.textContent=t.value;const dl=document.getElementById("d_"+k);if(dl)dl.textContent=deltaText(k);};
const refreshFU=()=>{ANCHORS.forEach(a=>{const f=document.getElementById("fu_"+a);if(f)f.innerHTML=followupsHTML(a);});const c=document.getElementById("fuCount");if(c)c.textContent=fuCountText();};
const findQ=id=>activeQs().find(x=>x.id===id);

app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.s)setSlider(t);
  else if(t.dataset.q){const x=findQ(t.dataset.q);if(x&&x.type==="number")setVal(x,t.value);}
  else if(t.dataset.p){const x=PROFILE_QS.find(q=>q.field===t.dataset.p);if(x&&(x.type==="number"||x.type==="text"))profDraft[x.field]=t.value;}
});
app.addEventListener("change",async e=>{
  const t=e.target,ds=t.dataset;
  if(ds.s){setSlider(t);refreshFU();return;}
  if(ds.q){
    const x=findQ(ds.q);if(!x)return;stampDraft();
    if(x.type==="check"){const a=getVal(x);setVal(x,t.checked?[...a,t.value]:a.filter(v=>v!==t.value));refreshFU();}
    else if(x.type==="radio"){setVal(x,t.value);refreshFU();}
    else setVal(x,t.value);
    return;}
  if(ds.p){
    const x=PROFILE_QS.find(q=>q.field===ds.p);if(!x)return;
    if(x.type==="check"){const a=pVal(x);profDraft[x.field]=t.checked?[...a,t.value]:a.filter(v=>v!==t.value);}
    else profDraft[x.field]=t.value;
    refreshProfile();
    return;}
  if(ds.c){stampDraft();const a=draft[ds.c];draft[ds.c]=t.checked?[...a,t.value]:a.filter(v=>v!==t.value);refreshFU();return;}
  if(t.id==="file"){
    try{tryImport(await t.files[0].text());}catch(err){say("Could not read that file.");}
  }
});
function addTo(list,label){
  askText(`New ${label} (keep it consistent)`,v=>{
    const n=(v||"").trim().toLowerCase();
    if(n&&!db[list].includes(n)){db[list].push(n);save();render();}
  });
}
function tryImport(text){
  let d;
  try{const p=JSON.parse(text);if(!p||!Array.isArray(p.entries))throw 0;d=normalize(p);}catch(e){say("That is not a valid backup.");return;}
  ask(`Replace current data with ${d.entries.length} imported entries?`,()=>{db=d;save();resetDraft();render();say("Imported.");});
}
document.addEventListener("click",e=>{
  const t=e.target,ds=t.dataset||{};
  if(ds.tab){tab=ds.tab;render();window.scrollTo(0,0);return;}
  if(ds.s){setSlider(t);refreshFU();return;}   // counts a tap on the current value
  if(ds.dlg){
    const p=pending,v=(document.getElementById("dlgText")||{}).value;
    closeDlg();
    if(p&&ds.dlg==="yes"&&p.yes)p.yes();else if(p&&ds.dlg==="ok"&&p.ok)p.ok(v);
    return;}
  if(ds.x==="status"){status("");return;}
  if(ds.sel){const ta=document.getElementById(ds.sel);if(ta){ta.focus();ta.select();try{document.execCommand("copy");}catch(err){}}return;}
  if(ds.del){const id=ds.del;ask("Delete this entry?",()=>{db.entries=db.entries.filter(x=>String(x.id)!==id);save();render();});return;}
  if(ds.rl){const k=ds.rl,item=ds.rm;ask(`Remove "${item}" from the list?`,()=>{db[k]=db[k].filter(x=>x!==item);save();render();});return;}
  const stamp=new Date().toISOString().slice(0,10);
  switch(t.id){
    case "addEmo":addTo("emotions","emotion");break;
    case "addBody":addTo("body","body sensation");break;
    case "profSave":saveProfile();break;
    case "profCancel":editingProfile=false;profDraft={};status("");render();window.scrollTo(0,0);break;
    case "editProfile":editingProfile=true;profDraft=db.profile?JSON.parse(JSON.stringify(db.profile.answers)):{};tab="log";status("");render();window.scrollTo(0,0);break;
    case "clearBtn":resetDraft();status("");render();window.scrollTo(0,0);break;
    case "saveBtn":saveEntry();break;
    case "expCsv":exportEntries(stamp);break;
    case "expJson":download(`lifelog2-backup-${stamp}.json`,JSON.stringify(db,null,1),"application/json");break;
    case "impJson":document.getElementById("file").click();break;
    case "wipe":
      ask("Delete ALL entries and lists? This cannot be undone.",()=>{db=normalize({entries:[]});save();resetDraft();render();say("All data deleted.");});
      break;
    case "impPaste":tryImport((document.getElementById("paste")||{}).value||"");break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="dlgText"){e.preventDefault();const b=document.querySelector('[data-dlg="ok"]');if(b)b.click();}
});
render();
</script>
